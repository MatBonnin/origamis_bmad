services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Eqlulfyk38}
      POSTGRES_DB: ${POSTGRES_DB:-origami}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-origami}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set origami http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}); do sleep 1; done;
      /usr/bin/mc mb --ignore-existing origami/${S3_BUCKET:-origami-transcripts};
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-Eqlulfyk38}@postgres:5432/origami}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_BUCKET: ${S3_BUCKET:-origami-transcripts}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/apps/api/uploads

  transcription-worker:
    build:
      context: .
      dockerfile: services/transcription-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - minio
      - api
      - minio-setup
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TRANSCRIPT_QUEUE_NAME: ${TRANSCRIPT_QUEUE_NAME:-transcript_jobs}
      TRANSCRIPT_API_BASE_URL: ${TRANSCRIPT_API_BASE_URL:-http://api:4000}
      TRANSCRIPT_WORKER_SECRET: ${TRANSCRIPT_WORKER_SECRET:-change_me}
      FASTER_WHISPER_MODEL: ${FASTER_WHISPER_MODEL:-small}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-cpu}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-int8}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_SECURE: ${S3_SECURE:-false}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - apps/web/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  api_uploads:
  minio_data:
